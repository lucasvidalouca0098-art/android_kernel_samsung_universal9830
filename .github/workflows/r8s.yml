name: Build Kernel - SM6225 (RKSU + SuSFS)

on:
  workflow_dispatch:
    inputs:
      KERNEL_BRANCH:
        description: 'Branch do kernel LineageOS'
        required: true
        default: 'lineage-23.0'
      RKSU_BRANCH:
        description: 'Branch do RKSU (rsuntk/KernelSU)'
        required: true
        default: 'susfs-rksu-master'
      SUSFS_BRANCH:
        description: 'Branch do SuSFS'
        required: true
        default: 'kernel-4.19'
      ANYKERNEL_BRANCH:
        description: 'Branch do AnyKernel3'
        required: true
        default: 'master'

env:
  KERNEL_REPO: https://github.com/LineageOS/android_kernel_motorola_sm6225
  CLANG_VERSION: clang-r487747c  # Clang 17 - compatível com kernel 4.19

jobs:
  build:
    name: Build Kernel (RKSU + SuSFS)
    runs-on: ubuntu-22.04
    
    steps:
      # ────────────────────────────────────────────
      # 1. Preparar ambiente
      # ────────────────────────────────────────────
      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg gperf \
            libelf-dev libncurses5-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc \
            zip zlib1g-dev python3 python-is-python3 \
            libpfm4-dev libunwind-dev

      - name: Set up ccache
        run: |
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
          ccache -M 5G

      - uses: actions/cache@v3
        with:
          path: ~/.ccache
          key: ccache-sm6225-${{ github.run_id }}
          restore-keys: ccache-sm6225-

      # ────────────────────────────────────────────
      # 2. Download Clang (Android Clang/LLVM)
      # ────────────────────────────────────────────
      - name: Download Android Clang toolchain
        run: |
          mkdir -p $HOME/toolchains/clang
          cd $HOME/toolchains/clang
          wget -q "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/${{ env.CLANG_VERSION }}.tar.gz" \
            -O clang.tar.gz || \
          wget -q "https://github.com/ZyCromerZ/Clang/releases/download/17.0.0-20230424-release/Clang-17.0.0-20230424.tar.gz" \
            -O clang.tar.gz
          tar -xf clang.tar.gz
          echo "CLANG_PATH=$HOME/toolchains/clang/bin" >> $GITHUB_ENV
          ls $HOME/toolchains/clang/bin/ | head -5

      # ────────────────────────────────────────────
      # 3. Clone kernel source
      # ────────────────────────────────────────────
      - name: Clone kernel source
        run: |
          git clone --depth=1 \
            -b ${{ github.event.inputs.KERNEL_BRANCH }} \
            ${{ env.KERNEL_REPO }} \
            kernel_source
          echo "Kernel source cloned!"
          cd kernel_source
          echo "HEAD: $(git log --oneline -1)"

      # ────────────────────────────────────────────
      # 4. Integrar RKSU (rsuntk/KernelSU)
      # ────────────────────────────────────────────
      - name: Integrate RKSU (rsuntk KernelSU)
        working-directory: kernel_source
        run: |
          echo ">>> Integrando RKSU branch: ${{ github.event.inputs.RKSU_BRANCH }}"
          curl -LSs "https://raw.githubusercontent.com/rsuntk/KernelSU/main/kernel/setup.sh" \
            | bash -s ${{ github.event.inputs.RKSU_BRANCH }}
          echo "RKSU integrado com sucesso!"

      # ────────────────────────────────────────────
      # 5. Aplicar patch do SuSFS
      # ────────────────────────────────────────────
      - name: Clone SuSFS and apply patches
        working-directory: kernel_source
        run: |
          echo ">>> Clonando SuSFS..."
          git clone --depth=1 \
            -b ${{ github.event.inputs.SUSFS_BRANCH }} \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            ../susfs4ksu

          echo ">>> Aplicando patch KernelSU/RKSU para SuSFS..."
          cp ../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch KernelSU/
          cd KernelSU
          patch -p1 < 10_enable_susfs_for_ksu.patch || true
          cd ..

          echo ">>> Aplicando patch principal do SuSFS no kernel 4.19..."
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch .
          patch -p1 < 50_add_susfs_in_kernel-4.19.patch || {
            echo "⚠️  Patch com rejeições - verificando hunks..."
            find . -name "*.rej" | head -20
            # Continua mesmo com rejeições parciais
            true
          }

          echo "SuSFS aplicado!"

      # ────────────────────────────────────────────
      # 6. Aplicar manual hooks Non-GKI
      # ────────────────────────────────────────────
      - name: Apply Non-GKI manual hooks (disable kprobes)
        working-directory: kernel_source
        run: |
          echo ">>> Desabilitando kprobes no KernelSU para Non-GKI..."
          # Substitui #ifdef CONFIG_KPROBES por #if defined(CONFIG_KPROBES) && 0
          find KernelSU -type f -name "*.c" -o -name "*.h" | xargs grep -l "CONFIG_KPROBES" | while read f; do
            sed -i 's/#ifdef CONFIG_KPROBES/#if defined(CONFIG_KPROBES) \&\& 0/g' "$f"
            echo "  Patched: $f"
          done
          echo "Hooks Non-GKI aplicados!"

      # ────────────────────────────────────────────
      # 7. Configurar defconfig
      # ────────────────────────────────────────────
      - name: Configure kernel (defconfig + KSU + SuSFS configs)
        working-directory: kernel_source
        run: |
          export PATH="${{ env.CLANG_PATH }}:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          # Gera .config base
          make O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 \
            vendor/bengal-perf_defconfig \
            vendor/debugfs.config \
            vendor/ext_config/moto-bengal.config

          # Habilita KernelSU (RKSU)
          scripts/config --file out/.config \
            -e CONFIG_KSU \
            -e CONFIG_KSU_MANUAL_HOOK \
            -d CONFIG_KSU_KPROBE_HOOK

          # Habilita SuSFS
          scripts/config --file out/.config \
            -e CONFIG_KSU_SUSFS \
            -e CONFIG_KSU_SUSFS_SUS_PATH \
            -e CONFIG_KSU_SUSFS_SUS_MOUNT \
            -e CONFIG_KSU_SUSFS_SUS_KSTAT \
            -e CONFIG_KSU_SUSFS_SUS_OVERLAYFS \
            -e CONFIG_KSU_SUSFS_TRY_UMOUNT \
            -e CONFIG_KSU_SUSFS_SPOOF_UNAME \
            -e CONFIG_KSU_SUSFS_ENABLE_LOG \
            -e CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
            -e CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT

          # Habilita KALLSYMS (necessário para Non-GKI)
          scripts/config --file out/.config \
            -e CONFIG_KALLSYMS \
            -e CONFIG_KALLSYMS_ALL

          # Regenera config para resolver dependências
          make O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 \
            olddefconfig

          echo ">>> Config final:"
          grep -E "CONFIG_KSU|CONFIG_SUSFS" out/.config

      # ────────────────────────────────────────────
      # 8. Compilar kernel
      # ────────────────────────────────────────────
      - name: Build kernel
        working-directory: kernel_source
        run: |
          export PATH="${{ env.CLANG_PATH }}:$PATH"
          export KBUILD_BUILD_USER="GithubActions"
          export KBUILD_BUILD_HOST="sm6225-builder"

          make -j$(nproc) \
            O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 LLVM_IAS=1 \
            Image.gz-dtb 2>&1 | tee build.log

          echo ">>> Verificando output..."
          ls -lh out/arch/arm64/boot/

      # ────────────────────────────────────────────
      # 9. Empacotar com AnyKernel3
      # ────────────────────────────────────────────
      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 \
            -b ${{ github.event.inputs.ANYKERNEL_BRANCH }} \
            https://github.com/osm0sis/AnyKernel3.git \
            AnyKernel3

          # Copia imagens do kernel
          cp kernel_source/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ 2>/dev/null || \
          cp kernel_source/out/arch/arm64/boot/Image.gz AnyKernel3/ 2>/dev/null || \
          cp kernel_source/out/arch/arm64/boot/Image AnyKernel3/ 2>/dev/null

          # Copia DTBO se existir
          [ -f kernel_source/out/arch/arm64/boot/dtbo.img ] && \
            cp kernel_source/out/arch/arm64/boot/dtbo.img AnyKernel3/

          # Gera ZIP
          TIMESTAMP=$(date +%Y%m%d-%H%M)
          ZIP_NAME="Kernel-SM6225-RKSU-SuSFS-${TIMESTAMP}.zip"
          cd AnyKernel3
          zip -r9 ../${ZIP_NAME} . -x ".git*" -x "*.md"
          cd ..

          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          echo ">>> Kernel empacotado: ${ZIP_NAME}"
          ls -lh ${ZIP_NAME}

      # ────────────────────────────────────────────
      # 10. Upload artefatos
      # ────────────────────────────────────────────
      - name: Upload kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-SM6225-RKSU-SuSFS
          path: "*.zip"
          retention-days: 7

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failure
          path: kernel_source/build.log
          retention-days: 3

      - name: Build summary
        if: success()
        run: |
          echo "## ✅ Build concluído com sucesso!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Kernel | sm6225 (bengal) - 4.19 |" >> $GITHUB_STEP_SUMMARY
          echo "| KernelSU | RKSU (${{ github.event.inputs.RKSU_BRANCH }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| SuSFS | ${{ github.event.inputs.SUSFS_BRANCH }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Toolchain | Clang (LLVM) |" >> $GITHUB_STEP_SUMMARY
          echo "| Arquivo | ${{ env.ZIP_NAME }} |" >> $GITHUB_STEP_SUMMARY
          
